# The toolchain a repository declares when its models are built by dbt and its
# SQL is written for the databricks dialect.
#
# Every command here was MEASURED (agent-smith p0505): each ran against a clean
# fixture of every repository shape and against one fixture per named defect, and
# only the commands that came back green on clean and red on a named defect are
# declared. The measurement pinned dbt-core 1.11.4, dbt-databricks 1.12.4 and
# sqlfluff 3.4.2; an image carrying other versions carries other evidence.
#
# Repository inputs this profile does NOT ship (see README.md):
#   profiles.yml  at the path `--profiles-dir` names
#   .sqlfluff     with the dbt built-ins stubbed as jinja macros
name: dbt-databricks
image: ghcr.io/holgerleichsenring/agent-smith-data-toolchain:1.0.0-bookworm
verify:
  # Measured green on the clean dbt and combined fixtures; red on a missing
  # package, an unresolved ref and a yaml syntax error. `dbt parse` alone reds on
  # a clean tree without `dbt deps` first, which is why the two are one command.
  - stage: dbt-parse
    command: dbt deps --profiles-dir . && dbt parse --profiles-dir .
    when_present: dbt_project.yml
  # Measured green on the clean dbt and combined fixtures; red on a bad dialect
  # and an undefined macro. Never measured on a repository with no models/.
  - stage: sql-lint
    command: sqlfluff lint --dialect databricks models
    when_present: models
