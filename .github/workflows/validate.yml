name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate master skills (frontmatter, description cap, declared inputs, principles)
        run: bash scripts/validate-skills.sh
      - name: The validator refuses the word phase outside the workflow-step allowlist (negative fixture)
        # 2026-10-12-7bd7: a guard that is never seen failing proves nothing. The
        # validator resolves its root from its own location, so it runs from the copy.
        run: |
          copy="$RUNNER_TEMP/phase-word-fixture"
          rm -rf "$copy"
          cp -R "$GITHUB_WORKSPACE" "$copy"
          mkdir -p "$copy/skills/phase-word-fixture"
          echo "Work on the phase you were given." > "$copy/skills/phase-word-fixture/SKILL.md"
          echo "## Phase 6 — one line more than the allowlist permits" >> "$copy/skills/_masters/security-master/SKILL.md"
          set +e
          bash "$copy/scripts/validate-skills.sh" > "$copy.log" 2>&1
          status=$?
          set -e
          cat "$copy.log"
          if [ "$status" -eq 0 ]; then
            echo "::error::validate-skills.sh passed on the phase-word fixture; it must fail"
            exit 1
          fi
          grep -q "skills/phase-word-fixture/SKILL.md says 'phase'" "$copy.log" \
            || { echo "::error::the unlisted fixture skill was not reported"; exit 1; }
          grep -q "skills/_masters/security-master/SKILL.md says 'phase' on 10 line(s)" "$copy.log" \
            || { echo "::error::the grown allowlisted file was not reported"; exit 1; }

  version-bump:
    # p0313: a changed master body with an unchanged version is invisible to every
    # consumer — the pin resolves to the same version string while the content moved.
    # Catalog-wide releases are cut by release-please; this guards the PER-MASTER
    # version each skill declares.
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Every changed master must bump its own version
        run: |
          base="origin/${{ github.base_ref }}"
          git fetch --quiet origin "${{ github.base_ref }}"
          failed=0
          for f in $(git diff --name-only "$base"...HEAD -- 'skills/_masters/*/SKILL.md'); do
            [ -f "$f" ] || continue          # deleted skill: nothing to bump
            before="$(git show "$base:$f" 2>/dev/null | sed -nE 's/^version:[[:space:]]*"?([^"]*)"?[[:space:]]*$/\1/p' | head -1)"
            [ -n "$before" ] || continue     # new skill: no previous version
            after="$(sed -nE 's/^version:[[:space:]]*"?([^"]*)"?[[:space:]]*$/\1/p' "$f" | head -1)"
            if [ "$before" = "$after" ]; then
              echo "::error file=$f::$(dirname "$f" | xargs basename) changed but version stayed $after — bump it"
              failed=1
            fi
          done
          exit $failed
